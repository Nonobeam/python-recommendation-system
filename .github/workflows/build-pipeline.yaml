name: Build and Deploy Pipeline

on:
  push:
    branches:
      - deploy/develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prd
        default: 'dev'

permissions:
  contents: write
  packages: write

env:
  BUILD_TYPE: "python"
  DOCKERFILE_PATH: "./Dockerfile"
  REGISTRY: "docker.io"
  TAG_PREFIX: "v"
  DEFAULT_BUMP: "patch"
  RELEASE_BRANCHES: "master,develop,staging"

jobs:
  tag-docker:
    runs-on: ubuntu-latest
    name: Create Git Tag for Docker Image
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout with full history & tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        
      - name: Bump version & create Git tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ env.DEFAULT_BUMP }}
          tag_prefix: ${{ env.TAG_PREFIX }}
          release_branches: ${{ env.RELEASE_BRANCHES }}
          fetch_all_tags: true
          create_annotated_tag: true

  build-system:
    runs-on: ubuntu-latest
    needs: tag-docker
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-url: ${{ steps.output.outputs.image-url }}
      image-tag: ${{ needs.tag-docker.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            ACCESS_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/python-recommendation-system:${{ needs.tag-docker.outputs.new_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/python-recommendation-system:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/python-recommendation-system:${{ steps.set-env.outputs.environment }}
          cache-from: |
            type=gha
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/python-recommendation-system:latest
          cache-to: |
            type=gha,mode=max
            type=inline

      - name: Output image details
        id: output
        run: |
          echo "image-url=${{ secrets.DOCKERHUB_USERNAME }}/python-recommendation-system:${{ needs.tag-docker.outputs.new_tag }}" >> $GITHUB_OUTPUT

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ secrets.DOCKERHUB_USERNAME }}/python-recommendation-system" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.tag-docker.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ steps.set-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: ${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-system
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/Capstone/devops
            echo "Pulling latest Python recommendation system image..."
            docker compose pull landmall-python
            echo "Restarting Python service..."
            docker compose up -d --no-deps landmall-python
            echo "Deployment complete!"
            docker compose ps landmall-python